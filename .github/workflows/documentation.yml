name: Documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Documentation contracts
        run: python scripts/diagnostics/check_docs.py
      - name: Checker regression fixtures
        run: python -m unittest discover -s tests/unit -p 'test_docs_checker.py'
      - name: Whitespace
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_REV" HEAD
