# Managed by dof.sh / dof.ps1; levels and PVF are instance data.
services:
  db:
    image: ${DOF_DB_IMAGE:-dof-easy-db:local}
    pull_policy: never
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run configure.py first}
      MYSQL_ROOT_HOST: '%'
    volumes:
    - database:/var/lib/mysql
    networks:
    - private
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT 1 FROM d_taiwan.accounts
        LIMIT 1" >/dev/null
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  keys:
    image: ${DOF_ADMIN_IMAGE:-dof-easy-admin:local}
    pull_policy: never
    entrypoint:
    - /bin/sh
    - /init-keys.sh
    network_mode: none
    environment:
      RAID_EXTENSION: ${RAID_EXTENSION:-off}
      LAUNCHER_MODE: ${LAUNCHER_MODE:-dof}
    volumes:
    - ./deploy/vipai86/init-keys.sh:/init-keys.sh:ro
    - ${RUNTIME_ROOT:-./runtime}/admin/data:/keys
    - ${RUNTIME_ROOT:-./runtime}/game/data:/game
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  game:
    image: ${DOF_GAME_IMAGE:-dof-easy-game:local}
    pull_policy: never
    restart: unless-stopped
    shm_size: 4g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      db:
        condition: service_healthy
      keys:
        condition: service_completed_successfully
      netguard:
        condition: service_healthy
    network_mode: service:netguard
    cap_drop:
    - NET_RAW
    environment:
      SERVER_TYPE: ALL
      SERVER_GROUP: '3'
      SERVER_GROUP_DB: cain
      OPEN_CHANNEL: ${OPEN_CHANNEL:-15,52}
      CLIENT_POOL_SIZE: '3'
      PUBLIC_IP: ${PUBLIC_IP:?Set public IPv4}
      CORE_PUBLIC_IP: 127.0.0.1
      MAIN_BRIDGE_IP: 127.0.0.1
      P2P_PUBLIC_IP: ${PUBLIC_IP:?Set public IPv4}
      P2P_RELAY_INDEX: '1'
      AUTO_PUBLIC_IP: 'false'
      DDNS_ENABLE: 'false'
      MAIN_MYSQL_HOST: db
      MAIN_MYSQL_PORT: '3306'
      MAIN_MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set password}
      MAIN_MYSQL_GAME_ALLOW_IP: '%'
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_GAME_ALLOW_IP: '%'
      DNF_DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set password}
      DOF_DB_GAME_PASSWORD: ${GAME_DB_PASSWORD:?required}
      DNF_DB_GAME_PASSWORD: ${GAME_DB_PASSWORD:?Set password}
      MYSQL_INIT_SSL_MODE: disabled
      WEB_USER: admin
      WEB_PASS: ${SUPERVISOR_PASSWORD:?Set password}
      PLUGIN_MODE: ${PLUGIN_MODE:-dp2-frida}
      RAID_EXTENSION: ${RAID_EXTENSION:-off}
      LAUNCHER_MODE: ${LAUNCHER_MODE:-dof}
      DNF_READINESS_PROFILE: native
      DNF_MAX_LEVEL: ${DNF_MAX_LEVEL:?Run dof.sh install}
      DNF_GAME_SHA256: ${DNF_GAME_SHA256:?Run dof.sh install}
    volumes:
    - ${RUNTIME_ROOT:-./runtime}/game/data:/data
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/auction:/home/neople/auction/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/point:/home/neople/point/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/bridge:/home/neople/bridge/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/channel:/home/neople/channel/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/community:/home/neople/community/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/coserver:/home/neople/coserver/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/dbmw_guild:/home/neople/dbmw_guild/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/dbmw_mnt:/home/neople/dbmw_mnt/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/dbmw_stat:/home/neople/dbmw_stat/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/guild:/home/neople/guild/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/manager:/home/neople/manager/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/monitor:/home/neople/monitor/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/relay:/home/neople/relay/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/statics:/home/neople/statics/log
    - ${RUNTIME_ROOT:-./runtime}/game/core-log/stun:/home/neople/stun/log
    - ${RUNTIME_ROOT:-./runtime}/game/log:/home/neople/game/log
    - ${RUNTIME_ROOT:-./runtime}/game/frida-log:/home/neople/game/frida_log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  admin:
    image: ${DOF_ADMIN_IMAGE:-dof-easy-admin:local}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dnf_service?useUnicode=true&characterEncoding=utf8&useSSL=false&autoReconnect=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD:?Set password}
      MYSQL_INIT_SSL_MODE: disabled
      DNF_PVF_PATH: /app/game-resources/Script.pvf
      DNF_PVF_INDEX: /app/data/pvf-index.json
      DNF_PUBLIC_IP: ${PUBLIC_IP:?Set public IPv4}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set password}
      ADMIN_TEMP_SECRET: ${ADMIN_TEMP_SECRET:?Set secret}
      LAUNCHER_MODE: ${LAUNCHER_MODE:-dof}
      DNF_MAX_LEVEL: ${DNF_MAX_LEVEL:?Run dof.sh install}
    volumes:
    - ${RUNTIME_ROOT:-./runtime}/admin/data:/app/data
    - ${RUNTIME_ROOT:-./runtime}/game/data/Script.pvf:/app/game-resources/Script.pvf:ro
    networks:
    - private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ingress:
    image: ${DOF_GAME_IMAGE:-dof-easy-game:local}
    pull_policy: never
    restart: unless-stopped
    entrypoint:
    - python3
    - -B
    - /ingress.py
    command:
    - --no-udp
    - --tcp
    - 18080:admin:80
    user: 65534:65534
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - ./deploy/vipai86/ingress.py:/ingress.py:ro
    depends_on:
      game:
        condition: service_healthy
      admin:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import socket; socket.create_connection(("127.0.0.1",18080),2).close()
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
    - ${ADMIN_BIND_IP:-${BIND_IP:-127.0.0.1}}:${ADMIN_PORT:-18080}:18080/tcp
    networks:
    - private
    - public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  netguard:
    image: ${DOF_NETGUARD_IMAGE:-dof-easy-netguard:local}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /run/netguard
    environment:
      NETGUARD_DB_HOST: db
      LAUNCHER_MODE: ${LAUNCHER_MODE:-dof}
      NETGUARD_ALLOWED_CLIENTS: ${ALLOWED_CLIENT_CIDRS:-}
      XTABLES_LOCKFILE: /run/netguard/xtables.lock
      OPEN_CHANNEL: ${OPEN_CHANNEL:-15,52}
    depends_on:
      db:
        condition: service_healthy
    ports:
    - ${GAME_BIND_IP:-${BIND_IP:-127.0.0.1}}:7001:7001/tcp
    - ${GAME_BIND_IP:-${BIND_IP:-127.0.0.1}}:7001:7001/udp
    - ${GAME_BIND_IP:-${BIND_IP:-127.0.0.1}}:7300:7300/tcp
    - ${GAME_BIND_IP:-${BIND_IP:-127.0.0.1}}:7300:7300/udp
    - ${GAME_BIND_IP:-${BIND_IP:-127.0.0.1}}:2311-2313:2311-2313/udp
    networks:
    - private
    - public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  private:
    internal: true
  public:
    driver: bridge
volumes:
  database: null
